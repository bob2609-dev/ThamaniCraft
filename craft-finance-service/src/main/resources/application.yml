server:
  port: 8084
spring:
  application:
    name: craft-finance-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:thamanicraft_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  flyway:
    schemas: finance
    default-schema: finance
  jpa:
    properties:
      hibernate:
        default_schema: finance
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
