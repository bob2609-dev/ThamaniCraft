spring:
  application:
    name: craft-identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:thamanicraft_db}
    username: ${DB_USER:thamanicraft_user}
    password: ${DB_PASS:thamanicraft_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: flyway_identity_history

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:byGoGQnH1ZQN1R6A3vQnZlpm4Deif2UKtCWPYrPZu2Jx/PkXgw70BQTt3Sr/5YkE9o7Ghslp3MCvUJXPAGWtpw==}
  expiration: 86400000
